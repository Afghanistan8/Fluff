# Fluff — GenLayer test and deploy configuration.
#
# Fluff targets the GenLayer Studio network (chain 61999).
#
#   pytest tests/direct/ -q                       # no node needed
#   FLUFF_INTEGRATION=1 gltest tests/integration/ --network studionet
#
# The direct suite runs the contract natively against the SDK. The integration suite
# needs a node and a funded account; add a key under networks.studionet.accounts and
# keep it out of version control.

networks:
  default: studionet

  studionet:
    leader_only: false

paths:
  contracts: contracts
  artifacts: artifacts

environment: .env
